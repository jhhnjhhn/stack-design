name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository
        run: python scripts/validate_all.py
      - name: Compile Python
        run: python -m compileall -q plugins/stack-design/skills/stack-design/scripts scripts tests
